name: Collect Japan trends

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-trends
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect Google Trends JP
        run: python scripts/update_trends.py
      - name: Save trend snapshot
        run: |
          git config user.name "stamp-moke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trends.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Japan trend snapshot"
          git push
